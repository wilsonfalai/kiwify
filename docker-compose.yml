services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kiwifyclone
      POSTGRES_PASSWORD: kiwifyclone
      POSTGRES_DB: kiwifyclone
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwifyclone -d kiwifyclone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
